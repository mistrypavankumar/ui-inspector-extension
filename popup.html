<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #ffffff;
      --bg-2: #f7f7f9;
      --card: #ffffff;
      --card-hover: #fafaff;
      --border: #ececf0;
      --border-strong: #dcdce3;
      --text: #0e0e16;
      --text-2: #4a4a58;
      --text-3: #8a8a99;
      --accent: #6950e8;
      --accent-text: #5b41dc;
      --accent-soft: rgba(105, 80, 232, .09);
      --accent-ring: rgba(105, 80, 232, .32);
      --accent-grad: linear-gradient(135deg, #7c5cff 0%, #6950e8 55%, #5b3fd9 100%);
      --glow: rgba(124, 92, 255, .16);
      --shadow-xs: 0 1px 2px rgba(16, 16, 32, .05);
      --shadow-md: 0 2px 4px rgba(16, 16, 32, .04), 0 8px 20px -4px rgba(16, 16, 32, .1);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131318;
        --bg-2: #18181f;
        --card: rgba(255, 255, 255, .03);
        --card-hover: rgba(255, 255, 255, .06);
        --border: rgba(255, 255, 255, .07);
        --border-strong: rgba(255, 255, 255, .13);
        --text: #f5f5f8;
        --text-2: #c4c4cf;
        --text-3: #7c7c8b;
        --accent: #8670ff;
        --accent-text: #b3a5ff;
        --accent-soft: rgba(134, 112, 255, .14);
        --accent-ring: rgba(134, 112, 255, .45);
        --glow: rgba(124, 92, 255, .22);
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, .3);
        --shadow-md: 0 2px 4px rgba(0, 0, 0, .3), 0 10px 24px -6px rgba(0, 0, 0, .5);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      font-feature-settings: 'cv11', 'ss01';
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(120% 70% at 0% 0%, var(--glow) 0%, transparent 60%),
        radial-gradient(90% 60% at 100% 0%, rgba(56, 189, 248, .08) 0%, transparent 60%),
        var(--bg);
      color: var(--text);
    }

    /* Header */
    .header { padding: 18px 18px 16px; display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 36px; height: 36px; flex-shrink: 0;
      background: var(--accent-grad);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .15), 0 6px 16px -4px var(--accent-ring), inset 0 1px 0 rgba(255, 255, 255, .25);
    }
    .logo svg { width: 18px; height: 18px; fill: #fff; }
    .header-text { flex: 1; min-width: 0; }
    .header-text h1 { font-size: 14.5px; font-weight: 700; letter-spacing: -.015em; color: var(--text); }
    .header-text p { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
    .badge {
      font-size: 10px; font-weight: 600; color: var(--accent-text);
      background: var(--accent-soft); padding: 2px 8px; border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    /* Primary CTA */
    .actions { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px; }
    .btn {
      width: 100%; border: none; cursor: pointer; font-family: inherit; text-align: left;
      display: flex; align-items: center; gap: 12px;
      transition: background .15s, border-color .15s, box-shadow .2s, transform .1s;
    }
    .btn:active { transform: scale(.985); }
    .btn:focus { outline: none; }
    .btn:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent-ring); }
    .btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

    .btn-primary {
      justify-content: center; height: 42px; border-radius: 11px;
      font-size: 13px; font-weight: 600; color: #fff; letter-spacing: -.005em;
      background: var(--accent-grad);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .15), 0 8px 20px -6px var(--accent-ring), inset 0 1px 0 rgba(255, 255, 255, .22);
      margin-bottom: 6px;
    }
    .btn-primary:hover { filter: brightness(1.07); box-shadow: 0 1px 2px rgba(0, 0, 0, .15), 0 10px 26px -6px var(--accent-ring), inset 0 1px 0 rgba(255, 255, 255, .22); }

    .btn-secondary {
      padding: 10px 12px; border-radius: 11px;
      background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-xs);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--card-hover); border-color: var(--accent-ring); box-shadow: var(--shadow-md); }
    .btn-icon {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-soft); color: var(--accent-text);
    }
    .btn-icon svg { width: 17px; height: 17px; }
    .btn-body { flex: 1; min-width: 0; }
    .btn-title { display: block; font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
    .btn-sub { display: block; font-size: 11px; color: var(--text-3); margin-top: 1px; font-weight: 400; }
    .chev { width: 16px !important; height: 16px !important; color: var(--text-3); opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .2s var(--ease); }
    .btn-secondary:hover .chev { opacity: 1; transform: none; }

    .status {
      font-size: 11.5px; color: var(--text-2); text-align: center; margin: 0 14px 12px;
    }
    .status:empty { display: none; }
    .status:not(:empty) {
      padding: 8px 12px; border-radius: 9px;
      background: rgba(234, 160, 8, .12); color: #a15c07;
    }
    @media (prefers-color-scheme: dark) { .status:not(:empty) { color: #fbbf24; } }

    .footer {
      padding: 10px 18px; border-top: 1px solid var(--border); background: var(--bg-2);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 10.5px; color: var(--text-3);
    }
    .footer .local { display: inline-flex; align-items: center; gap: 6px; }
    .footer .local::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%; background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .18);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </div>
    <div class="header-text">
      <h1>UI Inspector</h1>
      <p>Inspect any page's design</p>
    </div>
    <span class="badge">v1.0</span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="inspect-btn">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Open Inspector
    </button>
    <button class="btn btn-secondary" id="picker-btn">
      <span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></span>
      <span class="btn-body"><span class="btn-title">Pick Element</span><span class="btn-sub">Styles, box model &amp; contrast</span></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </button>
    <button class="btn btn-secondary" id="markup-btn">
      <span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>
      <span class="btn-body"><span class="btn-title">Markup Mode</span><span class="btn-sub">Annotate &amp; capture the page</span></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </button>
  </div>

  <p class="status" id="status"></p>

  <div class="footer">
    <span class="local">Runs 100% locally</span>
    <span id="status-dot"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
